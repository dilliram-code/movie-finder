<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CineMatch — Find Your Next Obsession</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9E%3C/text%3E%3C/svg%3E" />

<!-- Fonts: Bebas Neue = tall marquee/poster display face, Plus Jakarta Sans = body, JetBrains Mono = data readouts (ratings/scores) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Ambient drifting gradient blobs sit behind everything to give the glass surfaces something colourful to refract -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-magenta"></span>
    <span class="blob blob-cyan"></span>
    <span class="blob blob-gold"></span>
  </div>
  <div class="bg-grain" aria-hidden="true"></div>

  <!-- ============ NAVBAR ============ -->
  <header class="navbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 8L6.5 3H9L6.5 8H4Z" fill="currentColor"/>
        <path d="M9.5 8L12 3H14.5L12 8H9.5Z" fill="currentColor"/>
        <path d="M15 8L17.5 3H20L17.5 8H15Z" fill="currentColor"/>
        <rect x="3" y="8" width="18" height="13" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <span class="brand-text">CINE<b>MATCH</b></span>
    </div>

    <nav class="category-pills" id="categoryPills">
      <button class="pill is-active" data-category="trending">Trending</button>
      <button class="pill" data-category="popular">Popular</button>
      <button class="pill" data-category="top_rated">Top Rated</button>
      <button class="pill" data-category="upcoming">Upcoming</button>
      <button class="pill" data-category="now_playing">Now Playing</button>
    </nav>

    <div class="search-wrap">
      <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search any movie…" autocomplete="off" aria-label="Search movies" aria-expanded="false" />
      <div class="suggestions" id="suggestions" hidden></div>
    </div>
  </header>

  <!-- ============ HERO ============ -->
  <section class="hero">
    <p class="hero-eyebrow">Content-based recommendations · powered by TMDB &amp; TF‑IDF</p>
    <h1 class="hero-title">Find Your Next<br><span class="gradient-word">Obsession</span></h1>

    <div class="marquee-frame" id="heroSearchFrame">
      <div class="marquee-inner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="heroSearchInput" placeholder="Try “Interstellar”, “Parasite”, “Dune”…" autocomplete="off" aria-label="Search movies" aria-expanded="false"/>
        <button class="hero-search-btn" id="heroSearchBtn">Search</button>
      </div>
      <div class="suggestions suggestions--hero" id="heroSuggestions" hidden></div>
    </div>
  </section>

  <!-- ============ FEED ============ -->
  <main class="feed">
    <div class="section-header">
      <h2 id="feedTitle">Trending Today</h2>
      <span class="section-sub" id="feedSub">refreshed just now</span>
    </div>
    <div class="grid" id="movieGrid"><!-- cards injected by app.js --></div>
  </main>

  <footer class="site-footer">
    <span class="sprocket-row" aria-hidden="true"></span>
    <p>Built by <a href="https://www.dilliramchaudhary.com.np" class="myName">Dilli Ram Chaudhary </a>  with <span class="heart">❤️</span>
    </p>
  </footer>

  <!-- ============ DETAIL OVERLAY ============ -->
  <section class="detail-overlay" id="detailOverlay" aria-hidden="true">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <div class="detail-scrim"></div>

    <button class="detail-close" id="closeDetail" aria-label="Close details">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="detail-scroll">
      <div class="detail-content" id="detailContent">
        <!-- skeleton / real content injected here by app.js -->
      </div>
    </div>
  </section>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
